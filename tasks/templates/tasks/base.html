<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Task Manager{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        nav {
            background: #1f2937;
            color: white;
            padding: 20px 5%;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .welcome {
            font-size: 17px;
        }

        .logout-form {
            display: inline;
            margin: 0;
        }

        .logout-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 17px;
            padding: 0;
        }

        .logout-btn:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #6b7280;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 16px;
        }

        label {
            font-weight: bold;
        }

        .message {
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            background: #d1fae5;
            color: #065f46;
        }

        .task-card {
            background: white;
            border-left: 5px solid #2563eb;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .task-card h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .task-card p {
            font-size: 17px;
            line-height: 1.6;
        }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .empty-state h2 {
            color: #64748b;
            font-size: 30px;
        }

        .empty-state p {
            color: #64748b;
            font-size: 18px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }

        @media (max-width: 700px) {
            nav {
                gap: 15px;
            }

            .brand {
                width: 100%;
                margin-right: 0;
            }

            .top-row {
                flex-direction: column;
                align-items: flex-start;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="brand">
        Task Manager
    </div>

    {% if user.is_authenticated %}

        <span class="welcome">
            Welcome, {{ user.username }}
        </span>

        <a href="{% url 'task_list' %}">
            Dashboard
        </a>

        <a href="{% url 'task_create' %}">
            Add Task
        </a>

        <form method="post"
              action="{% url 'logout' %}"
              class="logout-form">

            {% csrf_token %}

            <button type="submit" class="logout-btn">
                Logout
            </button>

        </form>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}

</nav>


<div class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
