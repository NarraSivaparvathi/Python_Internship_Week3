{% extends 'tasks/base.html' %}

{% block title %}{{ title }} - Task Manager{% endblock %}

{% block content %}

<div class="card" style="max-width: 700px; margin: 40px auto;">

    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save Task
        </button>

        <a href="{% url 'task_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
